repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: check-yaml
          - id: check-merge-conflict
          - id: debug-statements
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: trailing-whitespace

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.6.9
      hooks:
          - id: ruff
            args: [--fix, --exit-non-zero-on-fix]
            files: \.py$
          - id: ruff-format
            files: \.py$

    - repo: https://github.com/oxc-project/mirrors-oxlint
      rev: v1.78.0
      hooks:
          - id: oxlint
            args:
              - --fix
            files: \.(js)$
            exclude: ^vendor/
            additional_dependencies: ['oxlint','oxlint-tsgolint']

    - repo: https://github.com/oxc-project/mirrors-oxfmt
      rev: v0.65.0
      hooks:
          - id: oxfmt
            args: [--write]
            files: \.(js|jsx|ts|tsx|mjs|cjs|json|html|css|scss|less|vue|md)$
            exclude: ^vendor/
