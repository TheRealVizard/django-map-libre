name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Enable Corepack and install Yarn dependencies
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn install

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1